name: Clip

options:
  bundleIdPrefix: com.michael
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ZV897Q6SZF
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

packages:
  ClipCore:
    path: ClipCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.27.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 0.18.0
  # swift-transformers 1.1.9, used by WhisperKit 0.18.0, is not
  # source-compatible with swift-jinja 2.4.0.
  SwiftJinja:
    url: https://github.com/huggingface/swift-jinja.git
    exactVersion: 2.3.6

targets:
  ClipMac:
    type: application
    platform: macOS
    sources:
      - path: ClipMac
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: ClipCore
      - package: WhisperKit
      - package: SwiftJinja
        product: Jinja
    entitlements:
      path: Config/ClipMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.michael.clip
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.michael.clip
        com.apple.developer.icloud-services:
          - CloudDocuments
    info:
      path: Config/ClipMac-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Clip for Mac
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: "Copyright © 2026 Michael Dempsey"
        NSUbiquitousContainers:
          iCloud.com.michael.clip:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Clip
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.michael.clip.clipbook
            UTTypeDescription: Clip audiobook
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - clipbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.clip
        PRODUCT_NAME: Clip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Clip:
    type: application
    platform: iOS
    sources:
      - path: Clip
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: ClipCore
      - package: GRDB
      - target: ClipWidgets
        embed: true
    entitlements:
      path: Config/Clip.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.michael.clip
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.michael.clip
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.michael.clip
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.siri: true
    info:
      path: Config/Clip-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Clip
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.michael.clip.flush
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSSiriUsageDescription: Clip uses Siri to save highlights while you listen.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Clip audiobook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.michael.clip.clipbook
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.com.michael.clip:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Clip
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.michael.clip.clipbook
            UTTypeDescription: Clip audiobook
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - clipbook
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-SemiBold.ttf
          - EBGaramond-Italic.ttf
        INAlternativeAppNames:
          - INAlternativeAppName: Bookmark
          - INAlternativeAppName: Highlight
          - INAlternativeAppName: Underline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.clip
        PRODUCT_NAME: Clip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClipTests
    dependencies:
      - target: Clip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.clip.tests

  ClipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClipUITests
    dependencies:
      - target: Clip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.clip.ui-tests

  ClipWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipWidgets
    dependencies:
      - package: ClipCore
      - package: GRDB
    entitlements:
      path: Config/ClipWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.michael.clip
    info:
      path: Config/ClipWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Clip Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.clip.widgets
        PRODUCT_NAME: ClipWidgets
        SKIP_INSTALL: YES

schemes:
  ClipMac:
    build:
      targets:
        ClipMac: all
    run:
      config: Debug
    archive:
      config: Release
  Clip:
    build:
      targets:
        Clip: all
        ClipWidgets: all
        ClipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ClipTests
          parallelizable: false
        - name: ClipUITests
          parallelizable: false
    archive:
      config: Release

name: Security checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/clip-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/clip-gitleaks/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/clip-gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/clip-gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/clip-gitleaks" gitleaks
      - name: Scan complete Git history
        env:
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: >-
          "$RUNNER_TEMP/clip-gitleaks/gitleaks" git . --log-opts=--all
          --redact=100 --no-banner --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/clip-gitleaks"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check support-site dependency advisories
        working-directory: SupportSite
        run: npm audit --audit-level=low
